name: Docker voice

# The optional voice service (apps/voice), its own image so the dashboard image stays small and chiseled.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  VOICE_IMAGE: ghcr.io/${{ github.repository_owner }}/homey-voice

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.VOICE_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: apps/voice
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=voice
          cache-to: type=gha,scope=voice,mode=max
