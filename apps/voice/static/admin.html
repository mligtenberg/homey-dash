<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice admin</title>
<style>
  body { font: 16px system-ui, sans-serif; background: #111; color: #eee; margin: 0; padding: 24px; max-width: 760px; margin-inline: auto; }
  a { color: #7aa7ff; }
  .m { background: #1c1c1c; border: 1px solid #333; border-radius: 12px; padding: 14px 16px; margin: 12px 0; }
  .m.sel { border-color: #1f7a3d; }
  .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .head strong { font-size: 17px; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: #333; color: #ccc; }
  .tag.ok { background: #1f7a3d; color: #fff; } .tag.warn { background: #8a5a00; color: #fff; }
  .note { color: #aaa; margin: 6px 0 10px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button { font: inherit; padding: 8px 14px; border: 0; border-radius: 8px; background: #2d6cdf; color: #fff; cursor: pointer; }
  button.alt { background: #3a3a3a; } button.bad { background: #8a2b2b; } button:disabled { opacity: .45; cursor: default; }
  progress { width: 200px; height: 10px; }
  .err { color: #e66; } #msg { min-height: 1.4em; color: #e66; }
</style>
</head>
<body>
<p><a href="./">← Voice</a></p>
<h1>Spraakherkenning</h1>
<p class="note">Kies welk model spraak omzet naar tekst. Download een model vooraf, dan hoeft het eerste commando niet te wachten.
Op een kleine CPU (zoals een N100) zijn <em>tiny</em> en <em>base</em> het snelst; grotere modellen geven betere Nederlandse tekst maar zijn trager.</p>
<div id="msg"></div>
<div id="list">Laden…</div>
<script>
const list = document.getElementById('list'), msg = document.getElementById('msg');
let timer = null;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const size = mb => mb >= 1000 ? (mb / 1000).toFixed(1) + ' GB' : mb + ' MB';

function render(s) {
  list.innerHTML = s.options.map(o => {
    const tags = [
      o.selected ? '<span class="tag ok">in gebruik</span>' : '',
      o.installed ? '<span class="tag ok">gedownload</span>' : '',
      o.size_mb ? `<span class="tag">${size(o.size_mb)}</span>` : '',
      o.last_ms != null ? `<span class="tag">laatste: ${(o.last_ms / 1000).toFixed(1)} s</span>` : '',
    ].join(' ');
    const pct = o.progress == null ? null : Math.round(o.progress * 100);
    const prog = o.downloading ? `<progress max="100" value="${pct}"></progress> ${pct}%` : '';
    const buttons = [
      o.selected ? '' : `<button data-act="select" data-id="${esc(o.id)}" ${o.usable ? '' : 'disabled'}>Gebruiken</button>`,
      !o.installed && !o.downloading ? `<button class="alt" data-act="download" data-id="${esc(o.id)}">Downloaden</button>` : '',
      o.installed && !o.selected && o.size_mb ? `<button class="alt bad" data-act="delete" data-id="${esc(o.id)}">Verwijderen</button>` : '',
    ].join(' ');
    return `<div class="m${o.selected ? ' sel' : ''}">
      <div class="head"><strong>${esc(o.label)}</strong> ${tags}</div>
      <div class="note">${esc(o.note)}</div>
      <div class="row">${buttons} ${prog}</div>
      ${o.error ? `<div class="err">Download mislukt: ${esc(o.error)}</div>` : ''}
    </div>`;
  }).join('');
  // keep polling while anything downloads
  clearTimeout(timer);
  if (s.options.some(o => o.downloading)) timer = setTimeout(load, 1000);
}

async function call(path, method = 'GET', body) {
  msg.textContent = '';
  const r = await fetch(path, { method, headers: body ? { 'content-type': 'application/json' } : {}, body: body && JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { msg.textContent = j.detail || `Fout ${r.status}`; return null; }
  return j;
}

async function load() { const s = await call('api/stt'); if (s) render(s); }

list.onclick = async e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const id = encodeURIComponent(b.dataset.id);
  b.disabled = true;
  const s = b.dataset.act === 'select' ? await call('api/stt/select', 'POST', { id: b.dataset.id })
    : b.dataset.act === 'download' ? await call(`api/stt/${id}/download`, 'POST')
    : confirm('Dit model van de schijf verwijderen?') ? await call(`api/stt/${id}`, 'DELETE') : null;
  if (s) render(s); else load();
};
load();
</script>
</body>
</html>
