# Copy to docker-compose.yml and adjust. Starts HomeyDash on http://<host>:8080
# (display app at /, Management at /admin/).
services:
  homey-dash:
    image: ghcr.io/mligtenberg/homey-dash:latest
    container_name: homey-dash
    restart: unless-stopped
    ports:
      - "8080:8080"
      # HTTPS with a self-signed certificate, see the environment below.
      # - "8443:8443"
    volumes:
      # The SQLite database (accounts, dashboards, displays, rules).
      # A bind mount must be writable by the container user, UID 1654:
      #   mkdir -p ./data && chown 1654:1654 ./data
      - ./data:/data
    environment:
      TZ: Europe/Amsterdam
      # HTTPS on 8443 with a self-signed certificate created on first boot and kept in /data.
      # Browsers warn once; the hosts below are added to the certificate (the address you browse to).
      # ASPNETCORE_HTTPS_PORTS: "8443"
      # SelfSignedCertificatePath: /data/https/homey-dash.pfx
      # SelfSignedCertificateHosts: "192.168.1.23,nas.local"
      # Playing Plex covers on Apple TVs through AirPlay finds them with multicast DNS, which reaches your network from a
      # container only with host networking (Linux): add `network_mode: host` and drop `ports` (ADR-0012).
      # Voice commands (optional): forwards /voice/... to the homey-voice service below. Remove with the service.
      # With `network_mode: host` the dashboard cannot resolve container names: publish the voice port below on 127.0.0.1
      # and use Voice__Address: "http://localhost:8765" instead.
      Voice__Address: "http://homey-voice:8765"
      # Defaults, only change if you move things:
      # ConnectionStrings__HomeyDash: "Data Source=/data/homey-dash.db"
      # ASPNETCORE_HTTP_PORTS: "8080"
      # Logging__LogLevel__Default: Information

  # Voice control (optional, separate container: Python, ffmpeg, speech-to-text). Open it at http://<host>:8080/voice/
  # (the microphone needs HTTPS or localhost, see ASPNETCORE_HTTPS_PORTS above).
  homey-voice:
    image: ghcr.io/mligtenberg/homey-voice:latest
    container_name: homey-voice
    restart: unless-stopped
    # Speech recognition is bursty: keep it from starving the dashboard on a small NAS.
    cpus: 3
    mem_limit: 3g
    volumes:
      # Whisper and Needle download once to here (~0.6 GB). Must be writable by UID 1654:
      #   mkdir -p ./voice-models && chown 1654:1654 ./voice-models
      - ./voice-models:/models
    environment:
      TZ: Europe/Amsterdam
      # Rooms and devices come from HomeyDash itself, so there is no second list to keep up to date.
      # With the dashboard on the host network, use the host's address and its http port instead (http://192.168.1.23:8081).
      HOMEY_DASH_URL: "http://homey-dash:8080"
      # Spoken wake word (spellings Whisper may write, comma-separated) and the Whisper size.
      # VOICE_WAKE: "homey,homie,homi"
      # The speech model is chosen (and downloaded ahead of time) at http://<host>:8080/voice/admin.html; VOICE_MODEL only
      # sets the first choice. VOICE_THREADS: CPU threads for Whisper (an N100 has 4).
      # VOICE_MODEL: small
      # VOICE_THREADS: 3
      # Mistral Voxtral in the cloud (listed on the admin page; the audio goes to Mistral):
      # MISTRAL_API_KEY: ""
    depends_on:
      - homey-dash
